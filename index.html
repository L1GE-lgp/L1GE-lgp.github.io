<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>问武 · 州桥</title>
<style>
html,body{margin:0;height:100%;background:#0f0d0b;color:#d8cfc0;}
#boot{display:flex;align-items:center;justify-content:center;height:100%;font:14px/1.6 "Noto Serif SC",serif;letter-spacing:2px;color:#756a58;}
</style>
</head>
<body>
<div id="boot">正在展开……</div>
<script>
(async () => {
  const src = 'https://aka.doubaocdn.com/s/WOzUVc4aVt';
  try {
    const r = await fetch(src, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const html = await r.text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    const b = document.getElementById('boot');
    if (b) b.textContent = '载入失败，请刷新重试。';
    console.error(e);
  }
})();
</script>
</body>
</html>
